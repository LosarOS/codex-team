name: Windows installer and release

on:
  push:
    branches: [master, codex/windows-installer]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (for example v1.0.0-rc2)'
        required: true
        default: v1.0.0-rc12
        type: string
      publish:
        description: Publish verified binaries as a GitHub prerelease
        default: true
        type: boolean
      skip_source_tests:
        description: Skip the full source suite for this manual build (installer smoke still required)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SKIP_SOURCE_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_source_tests }}
    defaults:
      run:
        shell: pwsh
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validate release metadata
        id: metadata
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          if ($env:SKIP_SOURCE_TESTS -eq 'true' -and $env:PUBLISH_REQUESTED -eq 'true') { throw 'Publication requires the complete source suite; disable publish for diagnostic builds.' }
          $version = (& python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read source version' }
          $match = [regex]::Match($version, '^(\d+\.\d+\.\d+)(?:(a|b|rc)(\d+))?$')
          if (-not $match.Success) { throw 'Only stable, alpha, beta or release-candidate source versions can be released' }
          $expectedTag = 'v' + $match.Groups[1].Value
          if ($match.Groups[2].Success) { $expectedTag += '-' + $match.Groups[2].Value + $match.Groups[3].Value }
          $tag = if ($env:REF_TAG) { $env:REF_TAG } elseif ($env:INPUT_TAG) { $env:INPUT_TAG } else { $expectedTag }
          if ($tag -cne $expectedTag) { throw "Release tag must match source version: $expectedTag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Check PowerShell syntax
        run: |
          foreach ($file in @('build-desktop.ps1','packaging/smoke-installed.ps1','packaging/Read-ShortcutDetails.ps1','packaging/Test-ShortcutPath.ps1','packaging/Update.ps1','packaging/Smoke-DesktopGui.ps1')) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Test and build Windows binaries
        run: |
          if ($env:SKIP_SOURCE_TESTS -eq 'true') {
            ./build-desktop.ps1 -PythonPath (Get-Command python).Source -SkipTests
          } else {
            ./build-desktop.ps1 -PythonPath (Get-Command python).Source
          }
      - name: Extracted portable backend and restart smoke
        run: |
          ./.venv/Scripts/python.exe packaging/smoke_portable.py
          if ($LASTEXITCODE -ne 0) { throw 'Extracted portable runtime smoke failed.' }
      - name: Silent per-user installation and installed backend smoke
        env:
          CODEX_TEAM_UPDATE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./packaging/smoke-installed.ps1 -ReportPath packaging/installed-smoke.json
      - name: Actual portable WebView2 GUI and native Save smoke
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -ExecutionPolicy Bypass -File ./packaging/Smoke-DesktopGui.ps1 -ArchivePath (Resolve-Path 'dist/CodexTeam-Portable-x64.zip').Path -SourceCommit $env:GITHUB_SHA -OutputDirectory '.build-tools/native-gui'
          if ($LASTEXITCODE -ne 0) { throw 'Actual WebView2 GUI/native Save smoke failed.' }
      - name: Stage verified downloadable files
        run: |
          foreach ($proofFile in @('packaging/portable-smoke.json','packaging/installed-smoke.json')) {
            $proof = Get-Content -LiteralPath $proofFile -Raw | ConvertFrom-Json
            foreach ($gate in @('evolution_budget_export_verified','evolution_plan_verified','evolution_context_preview_verified','evolution_no_dispatch_verified','evolution_plan_restart_verified')) {
              if ($proof.$gate -ne $true) { throw "Missing RC12 frozen backend gate: $proofFile / $gate" }
            }
          }
          $guiProofPath = '.build-tools/native-gui/native-gui-proof.json'
          $gui = Get-Content -LiteralPath $guiProofPath -Raw | ConvertFrom-Json
          if ($gui.status -cne 'OBSERVED_NATIVE_GUI_SCENARIOS_PASSED' -or $gui.source_commit -cne $env:GITHUB_SHA -or $gui.probe_commit -cne $env:GITHUB_SHA) { throw 'Native GUI proof does not match the complete checked-out source.' }
          foreach ($gate in @('window_verified','task_form_verified','backend_connection_verified','portable_marker_profile_verified','budget_picker_verified','budget_saved_verified','graceful_quit_verified')) {
            if ($gui.$gate -isnot [bool] -or $gui.$gate -ne $true) { throw "Missing native GUI release gate: $gate" }
          }
          if ($gui.backend_connection_observed_label -cnotin @('Сервер доступен · проверяем Codex…','Сервер доступен · Codex не проверен','Нужен вход','Codex подключён')) { throw 'Native GUI backend connection observation is invalid.' }
          if ($gui.owned_process_force_cleanup -isnot [bool] -or $gui.owned_process_force_cleanup -ne $false -or $gui.owned_gui_backend_processes_remaining -ne 0) { throw 'Native GUI required force cleanup or left owned processes.' }
          if ($gui.login_requested -ne $false -or $gui.model_execution_requested -ne $false -or ($gui.PSObject.Properties.Name -notcontains 'sdk_account_calls') -or $null -ne $gui.sdk_account_calls) { throw 'Native GUI account/provider observation scope is invalid.' }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $required = @('installer/CodexTeam-Setup-x64.exe', 'dist/CodexTeam-Setup-x64.zip', 'dist/CodexTeam-Portable-x64.zip', 'dist/SHA256SUMS.txt', 'packaging/build-verification.json', 'packaging/release-checksums.json', 'packaging/installed-smoke.json', 'packaging/portable-smoke.json')
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" }
            Copy-Item -LiteralPath $file -Destination release-assets
          }
          Copy-Item -LiteralPath $guiProofPath -Destination release-assets/native-gui-proof.json
          $guiEvidence = @($guiProofPath)
          foreach ($name in @('native-dashboard-task-form.png','native-budget-preview.png','native-budget-save-picker.png')) {
            $path = Join-Path '.build-tools/native-gui' $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -le 8) { throw "Missing native GUI screenshot: $name" }
            $guiEvidence += $path
          }
          # Explicit allowlist: never publish profile logs, arbitrary files or UIA dumps.
          Compress-Archive -LiteralPath $guiEvidence -DestinationPath release-assets/CodexTeam-Native-GUI-Evidence.zip
          Copy-Item -LiteralPath docs/releases/v1.0.0-rc12.md -Destination release-assets/RELEASE-NOTES-RU.md
          $sourceTests = if ($env:SKIP_SOURCE_TESTS -eq 'true') { 'Full source suite: skipped by explicit manual request.' } else { 'Full source suite: passed.' }
          if ($env:SKIP_SOURCE_TESTS -eq 'true') {
            $testResults = @{ status = 'skipped'; source_commit = $env:GITHUB_SHA; platform = 'Windows' }
          } else {
            [xml]$junit = Get-Content -LiteralPath '.build-tools/source-tests.xml' -Raw
            $suites = @($junit.testsuites.testsuite)
            if (-not $suites.Count) { throw 'Native pytest evidence is missing its test suite.' }
            $total = 0; $skipped = 0; $failures = 0; $errors = 0; $seconds = 0.0
            foreach ($suite in $suites) {
              $total += [int]$suite.tests; $skipped += [int]$suite.skipped
              $failures += [int]$suite.failures; $errors += [int]$suite.errors
              $seconds += [double]::Parse($suite.time, [Globalization.CultureInfo]::InvariantCulture)
            }
            if ($total -le 0 -or $failures -ne 0 -or $errors -ne 0) { throw 'Native pytest report is empty or failed.' }
            $testResults = @{ status = 'passed'; source_commit = $env:GITHUB_SHA; platform = 'Windows'; tests = $total; passed = $total - $skipped; skipped = $skipped; failures = $failures; errors = $errors; duration_seconds = $seconds }
            $sourceTests += " Native pytest: $($testResults.passed) passed, $skipped skipped, $seconds seconds."
          }
          $testResults | ConvertTo-Json | Set-Content -LiteralPath release-assets/source-test-results.json -Encoding utf8
          @('Codex Team Windows x64', "Source commit: $env:GITHUB_SHA", $sourceTests, 'Automated checks: frozen bundle verification, extracted portable backend/restart/preservation, silent per-user install, installed backend/assets, same-version upgrade, reinstall/restart, profile preservation and uninstall smoke.', 'Passed: automated actual portable WebView2 window, task form, portable marker profile, native budget Save and graceful quit. Not verified: complete interactive user acceptance, physical Windows DPI/accessibility, live Codex login or agent execution. GUI account-call count is unknown, not zero.', 'These binaries are unsigned; Windows SmartScreen may require additional confirmation.') | Set-Content -LiteralPath release-assets/BUILD-NOTES.txt -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-team-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-diagnostics
          path: |
            .build-tools/source-tests.xml
            packaging/build-verification.json
            packaging/installed-smoke.json
            packaging/portable-smoke.json
            .build-tools/native-gui/native-gui-proof.json
            .build-tools/native-gui/*.png
            .build-tools/portable-smoke/*.log
            .build-tools/installed-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-team-windows-x64
          path: release-assets
      - name: Publish verified Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace existing downloadable binaries."
            exit 1
          fi
          existing_refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq '.[].ref')
          if grep -Fxq "refs/tags/$RELEASE_TAG" <<< "$existing_refs"; then
            tagged_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
            if [ "$tagged_commit" != "$SOURCE_COMMIT" ]; then
              echo "Existing tag points to a different source commit; refusing to mislabel binaries."
              exit 1
            fi
          fi
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          test -s release-assets/RELEASE-NOTES-RU.md
          gh release create "$RELEASE_TAG" release-assets/* --target "$SOURCE_COMMIT" --title "Codex Team $RELEASE_TAG · Windows x64" --notes-file release-assets/RELEASE-NOTES-RU.md --prerelease --draft
          mkdir -p published-assets
          gh release download "$RELEASE_TAG" --dir published-assets --pattern 'CodexTeam-Setup-x64.exe' --pattern 'CodexTeam-Setup-x64.zip' --pattern 'CodexTeam-Portable-x64.zip' --pattern 'SHA256SUMS.txt'
          cmp release-assets/SHA256SUMS.txt published-assets/SHA256SUMS.txt
          (cd published-assets && sha256sum -c SHA256SUMS.txt)
          for asset in CodexTeam-Setup-x64.exe CodexTeam-Setup-x64.zip CodexTeam-Portable-x64.zip; do
            test -s "published-assets/$asset"
          done
          # Assets stay draft until the downloaded GitHub bytes pass checksum verification.
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '{tag_name,draft,prerelease,assets:[.assets[]|{name,size,digest,browser_download_url}]}'
