name: Publish verified rc5 UI evidence
on:
  workflow_dispatch:
  push:
    branches: [codex/redesign-i18n-theme-audit-release]
    paths: [.github/workflows/rc5-evidence.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify release and prepare existing browser evidence
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/commits/v1.0.0-rc5 --jq .sha)" = df31e426d39560040cbcf77e31c67bf9d4b2352c
          gh release view v1.0.0-rc5 >/dev/null
          gh api repos/$GH_REPO/git/blobs/f55f26ecd3a5847d0074cb5715033b18c6799011 > /tmp/evidence-blob.json
          python - <<'PY'
          import base64, hashlib, json, pathlib, shutil
          root = pathlib.Path('release-evidence'); root.mkdir()
          blob = json.loads(pathlib.Path('/tmp/evidence-blob.json').read_text())
          data = base64.b64decode(blob['content'])
          digest = hashlib.sha256(data).hexdigest()
          assert len(data) == 25508017
          assert digest == 'abf796a9de4a54d34bce132d3e535537a4d19237a16b130c272a43e93977d8f4'
          name = 'CodexTeam-UI-Evidence-rc5.zip'
          (root/name).write_bytes(data)
          (root/'UI-EVIDENCE-SHA256.txt').write_text(digest + '  ' + name + '\n')
          for source, target in [('overview.png', 'CodexTeam-Overview.png'), ('intelligence-ru.png', 'CodexTeam-Intelligence-RU.png'), ('intelligence-en.png', 'CodexTeam-Intelligence-EN.png')]:
              shutil.copyfile(pathlib.Path('reports/redesign-rc5')/source, root/target)
          PY
      - name: Attach evidence without replacing existing release files
        run: gh release upload v1.0.0-rc5 release-evidence/*
