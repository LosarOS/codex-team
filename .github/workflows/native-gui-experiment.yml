name: Read-only Windows candidate review
on:
  push:
    branches: ['ops/native-gui-experiment']
    paths: ['.github/gui-experiment-request.json', '.github/workflows/native-gui-experiment.yml', 'packaging/Smoke-DesktopGui.ps1']
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows candidate build run ID
        required: true
        type: string
      source_sha:
        description: Exact candidate source commit (40 lowercase hex)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native-gui:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_RUN: ${{ inputs.run_id }}
      CANDIDATE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact candidate provenance before downloading
        id: candidate
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $request=Get-Content -LiteralPath '.github/gui-experiment-request.json' -Raw | ConvertFrom-Json -AsHashtable
            if ($request.Count -ne 2 -or -not $request.ContainsKey('run_id') -or -not $request.ContainsKey('source_sha')) { throw 'Only run_id/source_sha request is accepted.' }
            $env:CANDIDATE_RUN=[string]$request.run_id
            $env:CANDIDATE_SHA=[string]$request.source_sha
          }
          if ($env:CANDIDATE_RUN -notmatch '^\d+$' -or $env:CANDIDATE_SHA -notmatch '^[a-f0-9]{40}$') { throw 'Exact run/source required.' }
          $run = gh api "repos/$env:GH_REPO/actions/runs/$env:CANDIDATE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.path -ne '.github/workflows/windows-release.yml' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.head_sha -cne $env:CANDIDATE_SHA -or $run.repository.full_name -cne $env:GH_REPO -or $run.head_repository.full_name -cne $env:GH_REPO) { throw 'Unverified or foreign candidate.' }
          "run_id=$env:CANDIDATE_RUN" >> $env:GITHUB_OUTPUT
          "CANDIDATE_SHA=$env:CANDIDATE_SHA" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: codex-team-windows-x64
          path: candidate
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Check actual bytes and PowerShell syntax
        shell: pwsh
        run: |
          $manifest=Get-Content candidate/release-checksums.json -Raw | ConvertFrom-Json -AsHashtable
          $keys=@($manifest.Keys | Where-Object { [IO.Path]::GetFileName($_) -ceq 'CodexTeam-Portable-x64.zip' })
          if ($keys.Count -ne 1) { throw 'Portable checksum absent or ambiguous.' }
          $entry=$manifest[$keys[0]]
          $zip=Get-Item candidate/CodexTeam-Portable-x64.zip
          if ($zip.Length -le 0 -or $zip.Length -ne $entry.bytes -or (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry.sha256) { throw 'Candidate byte mismatch.' }
          $proof=Get-Content candidate/portable-smoke.json -Raw | ConvertFrom-Json
          if ($proof.source_commit -cne $env:CANDIDATE_SHA -or $proof.portable_backend_verified -ne $true) { throw 'Candidate backend/source proof mismatch.' }
          $errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'packaging/Smoke-DesktopGui.ps1'),[ref]$null,[ref]$errors) | Out-Null
          if ($errors.Count) {throw ($errors | Out-String)}
      - name: Independently verify all candidate binaries and native backend evidence
        shell: python
        env:
          REVIEW_RUN: ${{ steps.candidate.outputs.run_id }}
        run: |
          import base64,json,os,pathlib,re,subprocess,textwrap,tomllib
          repo=os.environ['GH_REPO'];sha=os.environ['CANDIDATE_SHA']
          source=json.loads(subprocess.run(['gh','api','repos/'+repo+'/contents/pyproject.toml?ref='+sha],capture_output=True,text=True,encoding='utf-8',check=True).stdout)
          version=tomllib.loads(base64.b64decode(source['content']).decode('utf-8'))['project']['version']
          match=re.fullmatch(r'(\d+\.\d+\.\d+)(?:rc(\d+))?',version);assert match
          os.environ['RELEASE_TAG']='v'+match[1]+('-rc'+match[2] if match[2] else '')
          os.environ['SOURCE_COMMIT']=sha
          workflow=pathlib.Path('.github/workflows/publish-windows-artifact.yml').read_text(encoding='utf-8-sig')
          code=textwrap.dedent(workflow.split("python3 - <<'PY'\n")[2].split('\n          PY',1)[0])
          assert code.count("pathlib.Path('release-assets')")==1
          code=code.replace("pathlib.Path('release-assets')","pathlib.Path('candidate')",1)
          scope={};exec(compile(code,'<existing-release-validator>','exec'),scope)
          assert scope['manifest']['app_version']==version
          tests=json.loads(pathlib.Path('candidate/source-test-results.json').read_text(encoding='utf-8-sig'))
          assets=[{'file':name,'bytes':record['bytes'],'sha256':record['sha256']} for name,record in sorted(scope['normalized'].items())]
          proof={'source_commit':sha,'source_build_run':os.environ['REVIEW_RUN'],'review_run':os.environ['GITHUB_RUN_ID'],'checksums_verified':True,'native_backend_evidence_verified':True,'native_gui_evidence_verified':True,'publication_performed':False,'assets':assets,'source_tests':tests,'gui_acceptance':'original canonical native-gui-proof.json and allowlisted archive validated; no GUI rerun or physical acceptance' }
          pathlib.Path('candidate-review.json').write_text(json.dumps(proof,indent=2)+'\n')
          print('All three Windows binaries and original backend/GUI release gates independently verified; no GUI rerun or publication.')
      - name: Preserve individually downloadable portable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RC12-review-portable
          path: candidate/CodexTeam-Portable-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Preserve individually downloadable installer candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RC12-review-installers
          path: |
            candidate/CodexTeam-Setup-x64.exe
            candidate/CodexTeam-Setup-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Preserve verified candidate hashes and original evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RC12-review-evidence
          path: |
            candidate-review.json
            candidate/*.json
            candidate/SHA256SUMS.txt
            candidate/BUILD-NOTES.txt
            candidate/RELEASE-NOTES-RU.md
            candidate/CodexTeam-Native-GUI-Evidence.zip
          if-no-files-found: error
          retention-days: 14
