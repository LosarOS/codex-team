[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-team"
version = "1.0.0rc8"
description = "Local Windows control center for independent official Codex agents"
requires-python = ">=3.11"
dependencies = ["openai-codex==0.162.1", "fastapi==0.143.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
desktop = ["pywebview==6.2.1", "psutil==7.2.2"]
test = ["pytest>=9.1,<10", "httpx>=0.28,<1"]

[project.scripts]
ai-team = "codex_team.cli:main"

[tool.setuptools.packages.find]
include = ["codex_team*"]

[tool.setuptools.package-data]
codex_team = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real Codex account usage, explicit opt-in only"]
